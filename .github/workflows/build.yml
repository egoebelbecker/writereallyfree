name: Build Applications

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Qt / XCB / XKB)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-util1 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libxcb-randr0 \
            libxcb-xkb1 \
            libxcb-sync1 \
            libxcb-shm0 \
            libxcb-glx0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxkbcommon0

      - name: Create Virtual Environment & Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          sed -i 's/^APP_VERSION = .*/APP_VERSION = "${{ github.ref_name }}"/' app.py
          echo "Set APP_VERSION to ${{ github.ref_name }}"

      - name: Run Tests
        run: |
          .venv/bin/python -m pytest -q

      - name: Package AppImage
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh
      - name: Rename AppImage with tag

        run: |
          echo "Renaming AppImage using ref ${{ github.ref_name }}"
          mv WriteReallyFree-x86_64.AppImage WriteReallyFree-${{ github.ref_name }}-x86_64.AppImage

      - name: List Linux artifact files

        run: |
          echo "Listing Linux AppImage artifact:"
          ls -l WriteReallyFree-${{ github.ref_name }}-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WriteReallyFree-Linux-AppImage-${{ github.ref_name }}
          path: WriteReallyFree-${{ github.ref_name }}-x86_64.AppImage
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - python_arch: x64
            target_arch: x86_64
            arch: Intel (x86_64)
            artifact_suffix: x86_64
          - python_arch: arm64
            target_arch: arm64
            arch: Apple Silicon (arm64)
            artifact_suffix: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
          cache: 'pip'

      - name: Install macOS Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyobjc pyinstaller

      - name: Run Tests
        run: |
          .venv/bin/python -m pytest -q

      - name: Generate macOS ICNS Icon
        run: |
          mkdir -p web/icon.iconset
          sips -z 16 16     web/icon.png --out web/icon.iconset/icon_16x16.png
          sips -z 32 32     web/icon.png --out web/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     web/icon.png --out web/icon.iconset/icon_32x32.png
          sips -z 64 64     web/icon.png --out web/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   web/icon.png --out web/icon.iconset/icon_128x128.png
          sips -z 256 256   web/icon.png --out web/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   web/icon.png --out web/icon.iconset/icon_256x256.png
          sips -z 512 512   web/icon.png --out web/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   web/icon.png --out web/icon.iconset/icon_512x512.png
          sips -z 1024 1024 web/icon.png --out web/icon.iconset/icon_512x512@2x.png
          iconutil -c icns web/icon.iconset -o web/icon.icns
          rm -rf web/icon.iconset

      - name: Build via PyInstaller
        run: |
          .venv/bin/pyinstaller --clean \
            --name WriteReallyFree \
            --add-data "web:web" \
            --windowed \
            --icon "web/icon.icns" \
            --target-arch ${{ matrix.target_arch }} \
            --noconfirm \
            app.py

      - name: Package DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "WriteReallyFree" \
            --volicon "web/icon.icns" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "WriteReallyFree.app" 175 120 \
            --hide-extension "WriteReallyFree.app" \
            --app-drop-link 425 120 \
            "dist/WriteReallyFree.dmg" \
            "dist/WriteReallyFree.app"
      - name: Rename DMG with tag

        run: |
           echo "Renaming DMG using ref ${{ github.ref_name }} (${{ matrix.artifact_suffix }})"
           mv dist/WriteReallyFree.dmg dist/WriteReallyFree-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.dmg

      - name: List macOS DMG artifact file

        run: |
          echo "Listing DMG artifact:"
          ls -l dist/WriteReallyFree-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.dmg

      - name: Upload DMG Artifact

        uses: actions/upload-artifact@v4
        with:
          name: WriteReallyFree-macOS-DMG-${{ matrix.artifact_suffix }}-${{ github.ref_name }}
          path: dist/WriteReallyFree-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: WriteReallyFree-Linux-AppImage-${{ github.ref_name }}
          path: ./artifacts

      - name: Download macOS x86_64 DMG
        uses: actions/download-artifact@v4
        with:
          name: WriteReallyFree-macOS-DMG-x86_64-${{ github.ref_name }}
          path: ./artifacts

      - name: Download macOS arm64 DMG
        uses: actions/download-artifact@v4
        with:
          name: WriteReallyFree-macOS-DMG-arm64-${{ github.ref_name }}
          path: ./artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/WriteReallyFree-${{ github.ref_name }}-x86_64.AppImage
            ./artifacts/WriteReallyFree-${{ github.ref_name }}-x86_64.dmg
            ./artifacts/WriteReallyFree-${{ github.ref_name }}-arm64.dmg
