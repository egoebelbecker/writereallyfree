name: Build Applications

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Create Virtual Environment & Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Package AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WriteReallyFree-Linux-AppImage
          path: WriteReallyFree-x86_64.AppImage
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install macOS Dependencies
        run: |
          pip install --upgrade pip
          # pyobjc bindings are required for pywebview on macOS
          pip install pywebview pyobjc pyinstaller

      - name: Generate macOS ICNS Icon
        run: |
          mkdir -p web/icon.iconset
          sips -z 16 16     web/icon.png --out web/icon.iconset/icon_16x16.png
          sips -z 32 32     web/icon.png --out web/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     web/icon.png --out web/icon.iconset/icon_32x32.png
          sips -z 64 64     web/icon.png --out web/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   web/icon.png --out web/icon.iconset/icon_128x128.png
          sips -z 256 256   web/icon.png --out web/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   web/icon.png --out web/icon.iconset/icon_256x256.png
          sips -z 512 512   web/icon.png --out web/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   web/icon.png --out web/icon.iconset/icon_512x512.png
          sips -z 1024 1024 web/icon.png --out web/icon.iconset/icon_512x512@2x.png
          iconutil -c icns web/icon.iconset -o web/icon.icns
          rm -rf web/icon.iconset

      - name: Build via PyInstaller
        run: |
          pyinstaller --clean \
            --name WriteReallyFree \
            --add-data "web:web" \
            --windowed \
            --icon "web/icon.icns" \
            --noconfirm \
            app.py

      - name: Package DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "WriteReallyFree" \
            --volicon "web/icon.icns" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "WriteReallyFree.app" 175 120 \
            --hide-extension "WriteReallyFree.app" \
            --app-drop-link 425 120 \
            "dist/WriteReallyFree.dmg" \
            "dist/WriteReallyFree.app"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WriteReallyFree-macOS-DMG
          path: dist/WriteReallyFree.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: WriteReallyFree-Linux-AppImage
          path: ./artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: WriteReallyFree-macOS-DMG
          path: ./artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/WriteReallyFree-x86_64.AppImage
            ./artifacts/WriteReallyFree.dmg
